apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: home-lan
  namespace: metallb-system
spec:
  addresses:
    - 192.168.0.200-192.168.0.202
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: home-lan
  namespace: metallb-system
spec:
  ipAddressPools:
    - home-lan
